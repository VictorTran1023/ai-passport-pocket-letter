<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口袋来信 · 我的名片</title>
<style>:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#0D0D11;color:#D0D0D0}body{max-width:440px;margin:0 auto;padding:32px 20px}h1{font-size:28px;margin:8px 0}p,small{color:#A0A0A0;line-height:1.6}label{display:block;margin:18px 0 5px}input,textarea{box-sizing:border-box;width:100%;background:#141418;border:1px solid #2A2A30;border-radius:10px;color:inherit;font:inherit;padding:12px;resize:vertical}input:focus,textarea:focus{outline:1px solid #00AEEF}input[type=checkbox]{width:20px;height:20px;accent-color:#00AEEF;vertical-align:middle}button{width:100%;background:#102B36;border:1px solid #00AEEF;border-radius:24px;padding:13px;color:#D0D0D0;font:inherit;margin:20px 0 0}button:disabled{opacity:.4}#preview{white-space:pre-wrap;background:#141418;border-radius:12px;padding:18px;line-height:1.7}#status{min-height:24px;color:#00F0FF}.face{font-size:30px;color:#00AEEF}a{color:#00AEEF}</style>
<div class="face" aria-hidden="true">✉</div><h1>我的口袋来信</h1><p>写一点自己，让下一次相遇有话可聊。</p>
<form id="form"><div id="fields"></div><label><input type="checkbox" id="contacts"> 公开联系方式</label><small>开启后，附近兼容设备可以收到所填联系方式。仅填写你愿意公开的信息。</small><button id="review" type="submit" disabled>预览名片</button></form>
<section id="confirm" hidden><h2>这就是对方会收到的内容</h2><div id="preview"></div><button id="save" type="button">确认保存到设备</button><button id="back" type="button">返回修改</button></section><p id="status" role="status" aria-live="polite">正在连接设备…</p><small>无需互联网 · 内容保存在你的设备上<br>完成后，长按设备 OK 退出编辑。</small>
<script>
'use strict';const names=['昵称','职业 / 自我介绍','想说的话','兴趣 / 喜欢的食物','邮箱','Telegram 用户名','微信号'],limits=[48,96,144,96,80,48,64];let token='',revision=0,values=[],busy=false;const $=id=>document.getElementById(id);const bytes=s=>new TextEncoder().encode(s).length;
for(let i=0;i<7;i++){let label=document.createElement('label');label.htmlFor='f'+i;label.textContent=names[i];let el=document.createElement(i===2?'textarea':'input');el.id='f'+i;el.autocomplete='off';el.maxLength=limits[i];el.required=i===0;if(i===3)el.placeholder='例如：火锅，摄影，散步';let hint=document.createElement('small');hint.textContent='最多 '+limits[i]+' 字节，汉字通常占 3 字节';$('fields').append(label,el,hint);}
function state(msg){$('status').textContent=msg;}function disabled(b){busy=b;$('save').disabled=b;$('back').disabled=b;}
async function load(){try{let r=await fetch('/api/card',{cache:'no-store'});if(!r.ok)throw Error();let data=await r.json();token=data.token;revision=data.revision;data.fields.forEach((v,i)=>$('f'+i).value=v);$('contacts').checked=data.fields.slice(4).some(Boolean);$('review').disabled=false;state('设备已连接');}catch{state('连接失败，请确认手机已加入设备热点，然后刷新。');}}
$('form').onsubmit=e=>{e.preventDefault();values=names.map((_,i)=>$('f'+i).value.trim());values[3]=values[3].replace(/，/g,',');if(!$('contacts').checked)values.fill('',4);for(let i=0;i<7;i++){if(bytes(values[i])>limits[i]){state(names[i]+'太长，请缩短。');return;}if(/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/.test(values[i])){state(names[i]+'含有不支持的控制字符。');return;}}if(!values[0]){state('请填写昵称。');return;}$('preview').textContent=values.map((v,i)=>v?names[i]+'：'+v:'').filter(Boolean).join('\n');$('form').hidden=true;$('confirm').hidden=false;state('确认这些内容可以公开交换。');};
$('back').onclick=()=>{if(busy)return;$('confirm').hidden=true;$('form').hidden=false;state('继续编辑');};
$('save').onclick=async()=>{if(busy)return;disabled(true);state('正在保存…');try{let r=await fetch('/api/card',{method:'POST',headers:{'Content-Type':'application/json','X-StreetPass-Token':token},body:JSON.stringify({revision,fields:values})});if(!r.ok){let msg=await r.text();throw Error(msg);}let d=await r.json();revision=d.revision;state('已保存。现在长按设备 OK，继续相遇。');$('save').hidden=true;$('back').textContent='再修改';}catch(e){state('保存未确认：'+e.message+'。请保持热点连接后重试。');}finally{disabled(false);}};
$('back').addEventListener('click',()=>{$('save').hidden=false;});load();
</script></html>
